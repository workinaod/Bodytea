name: Deploy to GitHub Pages

on:
  push:
    # The working branch ships. Only ONE working branch is listed at a
    # time and that is the point: when two were, both published to
    # gh-pages and whichever pushed last decided the live site, which is
    # how the live build ended up trailing the code by 23 commits.
    # Moving to a new branch means editing this line, not adding to it.
    #
    # `main` was listed here too, which contradicted the paragraph above
    # it and was a live hazard rather than a spare door: main is still
    # the one-commit scaffold, so a single push to it would have
    # published an empty app over the working site. One branch means one.
    branches:
      - claude/app-audit-refinement-sjw2va
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      # Pushing gh-pages does NOT enable Pages on its own: this job published
      # here for 112 commits while the site served a 404, until Pages was
      # pointed at gh-pages/(root) by hand in Settings. Keep that setting.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
