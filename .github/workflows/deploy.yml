name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/fitness-tracking-app-ugo5xt
      # The working branch. gh-pages was publishing from the line above
      # while every commit for the last stretch landed here, so the live
      # site sat 23 commits behind the code.
      - claude/app-audit-refinement-sjw2va
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      # Publishing the gh-pages branch auto-enables GitHub Pages on public repos.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
