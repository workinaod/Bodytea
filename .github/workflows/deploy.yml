name: Deploy to GitHub Pages

on:
  push:
    # main is the only source of truth for what ships. Listing working
    # branches here is what let two of them race to publish gh-pages, so
    # whichever pushed last decided the live site. Merge to main instead;
    # use workflow_dispatch to republish without a new commit.
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      # Pushing gh-pages does NOT enable Pages on its own: this job published
      # here for 112 commits while the site served a 404, until Pages was
      # pointed at gh-pages/(root) by hand in Settings. Keep that setting.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
